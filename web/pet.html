<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Copri</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>
<div id="stage">
  <div id="bubble" class="hidden"><span id="bubble-text"></span></div>

  <!-- 分层：头发、闪烁的闪粉、身体各是一个 SVG。头发画一次就不再重绘，
       漂浮/摇曳/闪烁都是对整层做 transform/opacity，交给 GPU 合成，不用每帧重画几千个闪粉 -->
  <svg id="shadowsvg" class="layer" viewBox="0 0 260 560" xmlns="http://www.w3.org/2000/svg">
    <g id="shadow"><ellipse cx="131" cy="556" rx="26" ry="3.5"/></g>
  </svg>

  <div id="pet">
    <!-- 漂浮的绿色碎片：单独一层，整层飘动 -->
    <svg id="shardsvg" class="layer" viewBox="0 0 260 560" xmlns="http://www.w3.org/2000/svg">
      <g id="shards">
        <polygon class="shard" points="30,280 36,274 24,350 18,356"/>
        <polygon class="shard" points="44,330 48,326 42,376 37,380"/>
        <polygon class="shard" points="226,240 231,236 226,300 221,304"/>
      </g>
    </svg>

    <div id="hairwrap">
      <svg id="hairsvg" class="layer" viewBox="0 0 260 560" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- redGlit：红底泼墨闪粉，用在身上的红色部分（墨点由 pet.js 生成） -->
          <pattern id="redGlit" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#e43050"/></pattern>
          <!-- fineGlit：头发上细密的闪粉底（透明底，pet.js 填点），topFade 让它越往上越密越亮，和原图一样 -->
          <pattern id="fineGlit" width="36" height="36" patternUnits="userSpaceOnUse"></pattern>
          <linearGradient id="fadeGrad" x1="0" y1="-50" x2="0" y2="175" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/>
          </linearGradient>
          <linearGradient id="hazeGrad" x1="0" y1="-50" x2="0" y2="120" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <mask id="topFade" maskUnits="userSpaceOnUse" x="0" y="-60" width="260" height="240"><rect x="0" y="-60" width="260" height="240" fill="url(#fadeGrad)"/></mask>

          <!-- 轮廓形状：不带 class，方便 <use> 上色（紫色描边层和本体共用） -->
          <path id="hairShape" fill-rule="evenodd" clip-rule="evenodd" d="M96.1,-49.0 L98.5,-47.1 L99.0,-38.9 L91.3,-38.0 L68.9,-13.1 L65.5,-11.2 L64.6,-6.9 L59.3,-3.6 L59.3,-0.7 L62.7,2.6 L65.1,2.2 L65.5,-3.6 L71.3,1.2 L74.1,1.2 L107.6,-10.7 L139.1,-19.8 L144.4,-22.7 L144.4,-26.5 L147.2,-32.2 L155.4,-31.8 L176.4,-39.9 L175.4,-36.1 L169.2,-35.1 L154.4,-21.7 L155.4,-18.9 L159.7,-18.9 L162.5,-22.2 L169.2,-24.6 L169.2,-22.7 L159.7,-14.1 L157.8,-12.7 L144.4,-11.2 L124.8,5.5 L119.5,8.4 L108.1,19.4 L108.5,21.7 L113.8,20.8 L118.6,22.2 L117.6,27.0 L112.8,33.2 L113.3,35.6 L118.6,32.7 L119.1,28.4 L125.7,28.4 L129.1,17.4 L127.7,14.6 L128.6,12.7 L146.3,10.8 L159.7,-0.2 L160.6,-7.4 L162.5,-6.4 L161.6,6.5 L164.0,6.9 L175.4,0.2 L179.3,-6.4 L195.0,-12.7 L211.7,-17.4 L212.7,-10.7 L221.8,-12.2 L229.9,-39.9 L229.4,-44.2 L231.8,-43.7 L229.9,-27.0 L231.3,-13.1 L228.0,15.5 L228.9,20.8 L225.6,23.7 L225.1,15.1 L222.3,5.0 L216.0,6.0 L210.3,8.8 L204.6,77.2 L207.4,77.6 L224.2,70.5 L226.1,65.2 L229.4,70.0 L229.9,83.4 L233.2,83.9 L234.7,81.0 L236.6,49.9 L238.5,50.4 L239.0,94.4 L234.2,95.8 L233.2,97.7 L232.8,114.4 L233.2,119.7 L237.1,122.6 L238.0,131.6 L241.4,130.2 L243.8,118.7 L245.7,118.3 L245.7,148.4 L244.2,148.4 L239.0,135.5 L228.9,134.5 L219.4,138.3 L215.6,141.7 L215.1,168.9 L213.2,168.4 L213.2,156.0 L208.4,151.7 L202.7,117.3 L200.8,117.3 L196.0,123.5 L194.5,131.2 L191.2,134.5 L188.3,134.0 L186.9,129.7 L181.2,124.9 L175.0,127.8 L175.9,130.7 L184.0,135.9 L179.7,135.9 L169.7,142.1 L169.2,145.5 L180.2,159.3 L154.4,136.4 L151.1,135.9 L141.0,141.2 L147.2,135.5 L175.9,120.2 L175.9,118.3 L173.5,117.8 L152.5,124.0 L157.8,117.8 L157.8,115.9 L155.4,114.0 L158.2,107.3 L155.8,106.8 L148.2,111.1 L152.0,98.7 L152.0,96.8 L149.6,96.3 L127.2,128.8 L126.2,126.9 L128.1,116.8 L125.7,116.3 L109.5,132.6 L103.3,136.4 L106.2,121.6 L106.2,119.7 L103.8,119.2 L86.1,144.5 L81.3,148.4 L82.3,140.2 L73.2,94.4 L71.3,94.4 L63.6,101.5 L34.5,120.2 L32.6,124.9 L35.9,126.9 L29.7,133.1 L29.7,135.9 L11.6,134.0 L11.6,132.1 L21.1,130.2 L47.4,102.5 L46.9,100.1 L44.5,100.1 L27.3,109.2 L23.0,109.2 L14.4,113.0 L8.2,118.3 L13.5,110.1 L13.5,105.4 L8.2,71.9 L6.8,70.5 L2.0,71.9 L2.0,70.5 L12.0,55.2 L17.8,56.1 L30.2,45.2 L30.2,42.8 L27.3,39.9 L16.8,16.5 L12.0,12.2 L22.1,11.7 L24.0,17.0 L25.4,17.4 L28.8,33.7 L32.1,42.3 L36.9,39.9 L42.6,40.9 L42.6,33.7 L36.9,25.6 L28.8,19.4 L32.1,-2.1 L37.8,-1.7 L38.3,-5.0 L50.3,-15.5 L88.0,-43.7 L93.7,-43.7 Z M196.9,13.1 L203.1,15.5 L203.6,19.4 L185.9,68.6 L185.5,83.9 L185.0,85.3 L182.1,84.8 L179.7,83.9 L182.1,78.6 L182.6,69.5 L183.1,44.7 L181.2,39.9 L187.9,38.5 L195.0,25.1 Z M173.5,35.6 L175.4,35.6 L175.9,39.4 L178.3,40.4 L178.3,42.8 L171.1,45.2 L166.8,47.1 L164.4,47.1 L164.4,45.2 Z"/>
          <polygon id="torsoShape" points="105,165.5 111,169.5 151,169.5 157,165.5 155,174 151,196 146,211 142,230 145.5,246 148.5,257 150,267 131,272 112,267 113.5,257 116.5,246 120,230 116,211 111,196 107,174"/>
          <polygon id="legLShape" points="114,250 131,259 131,272 131,330 129.5,388 128,404 129.5,428 128,470 126.5,512 126,530 126.5,557 122.5,530 120.5,514 116.5,472 113.5,432 112,412 114.5,401 112.5,391 108.5,342 107.5,302 111.5,268"/>
          <polygon id="legRShape" points="148,250 150.5,268 154.5,302 153.5,342 149.5,391 147.5,401 150,412 148.5,432 145.5,472 141.5,514 139.5,530 135.5,557 136,530 135.5,512 134,470 132.5,428 134,404 132.5,388 131,330 131,272 131,259"/>
          <polygon id="armLShape" points="106,166 115,171 117,184 111,210 107.5,240 106.5,245 106,262 104.5,295 104,300 105.5,308 108,318 104.2,312.5 104.8,331 102.6,314.5 101.6,335 100.3,314.5 98,332 98.4,313 94.6,326 96.4,308 99,299 98.6,268 96.6,245 98.4,236 100.5,205 102,186 104,173"/>
          <polygon id="armRShape" points="156,166 147,171 145,184 151,210 154.5,240 155.5,245 156,262 157.5,295 158,300 156.5,308 154,318 157.8,312.5 157.2,331 159.4,314.5 160.4,335 161.7,314.5 164,332 163.6,313 167.4,326 165.6,308 163,299 163.4,268 165.4,245 163.6,236 161.5,205 160,186 158,173"/>
          <!-- 头：按 face 文件夹正脸特写（12.51.18 等）测量。面罩两侧就是脸的两侧，往下收窄，下巴是偏左的 V 形 -->
          <path id="headShape" d="M107,104 L155,104 L152.9,115.5 L147.5,133 L146,138.6 L128,146.8 L115,139.6 L114.5,133 L109.1,115.5 Z"/>
          <polygon id="bangsShape" points="104,94 158,94 157,111.6 152.6,114.4 148,111.4 143,114.6 137.4,111.8 131.6,112.6 123.9,129.9 128.4,112.9 121,114.6 116.2,111.6 111.4,114.4 106,111.8"/>
          <clipPath id="bangsClip"><use href="#bangsShape"/></clipPath>

          <path id="crownShape" d="M110,124 L103.3,126.6 L77,113.5 L79.4,119.4 L55.5,123 L57.9,126.6 L36.4,129 L22.1,137.8 L30.4,137.8 L55.5,131.4 L53.1,134.5 L81.8,129 L79.4,132.6 L103.3,135 L112,134 Z M118,124 L112.8,93 L126,118 Z M134,118 L151,92 L142,121 Z M146,122 L160.6,101.5 L151,127 Z M148,129 L166,136 L163,138.5 L176,147 L160,141 L146,136 Z"/>
          <clipPath id="hairClip"><use href="#hairShape"/></clipPath>
          <clipPath id="legLClip"><use href="#legLShape"/></clipPath>
          <clipPath id="legRClip"><use href="#legRShape"/></clipPath>
          <clipPath id="torsoClip"><use href="#torsoShape"/></clipPath>
          <clipPath id="headClip"><use href="#headShape"/></clipPath>
        </defs>


        <!-- 头发（后层）：轮廓从原图 general/08.29.28 自动描出（红色部分，含发束间的缝隙），按脸的位置对齐缩放 -->
        <g id="hair" transform="translate(0,10)">
          <use href="#hairShape" class="hair-ol" transform="translate(-3.2,3.6)"/>
          <!-- 底部细黑边：黑色同形状往下错开一点，只在朝下的边缘露出来 -->
          <use href="#hairShape" class="ink" transform="translate(0,2.2)"/>
          <!-- 头发暗面：头后面压在红发下面的黑色闪电发束，只从红发底下露出来（照 08.29.28 底部，坐标按原图换算）：
               左下一大束台阶状黑发、右下一小束、脸后几根朝上的黑尖，同样带紫色错位描边 -->
          <use href="#crownShape" class="hair-ol" transform="translate(-2.4,2.6)"/>
          <use href="#crownShape" class="ink"/>
          <use href="#hairShape" class="hair-fill"/>
          <rect x="0" y="-60" width="260" height="240" fill="url(#hazeGrad)" clip-path="url(#hairClip)"/>
          <rect class="glitter" x="0" y="-60" width="260" height="240" fill="url(#fineGlit)" clip-path="url(#hairClip)" mask="url(#topFade)"/>
          <g class="glitter" clip-path="url(#hairClip)" id="splatA"></g>
        </g>
      </svg>
      <!-- 会闪的那层闪粉单独一层，只改透明度 -->
      <svg id="twinkle" class="layer" viewBox="0 0 260 560" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(0,10)"><g class="glitter" clip-path="url(#hairClip)" id="splatB"></g></g>
      </svg>
    </div>

    <svg id="copri" class="layer" viewBox="0 0 260 560" xmlns="http://www.w3.org/2000/svg">

        <!-- 身体：轮廓比例照 07.47.01 全身、08.25.42 正面；躯干图案照 body/ 文件夹的正面特写 -->
        <g id="body">
          <!-- 紫色描边全部放最底下（躯干 + 四肢），填色都画在上面：只在整个人的外轮廓露出紫边，
               四肢和躯干之间不再出现紫线，看起来是一整个身体。四肢描边用 p-* class 跟着四肢一起动 -->
          <g class="limb p-legL"><use href="#legLShape" class="ol" transform="translate(-2.5,2.5)"/></g>
          <g class="limb p-legR"><use href="#legRShape" class="ol" transform="translate(-2.5,2.5)"/></g>
          <g class="limb p-armL"><use href="#armLShape" class="ol" transform="translate(-2.5,2.5)"/></g>
          <g class="limb p-armR"><use href="#armRShape" class="ol" transform="translate(-2.5,2.5)"/></g>
          <use href="#torsoShape" class="ol" transform="translate(-2.5,2.5)"/>
          <g id="legL" class="limb p-legL">
            <use href="#legLShape" class="ink"/>
            <polygon class="green" points="109,282 119,285 117,304 109,299"/>
            <!-- 大腿根：紧贴胯下的一圈黑带，上面鞋带状红线；两条腿各自一圈，不连在一起 -->
            <g clip-path="url(#legLClip)"><polygon class="ink" points="106,261 133,267 133,281 106,275"/><polyline class="lace" points="110.0,266.5 115.2,274.8 120.5,269.0 125.8,277.2 131.0,271.5"/><polyline class="lace" points="110.0,273.5 115.2,267.8 120.5,276.0 125.8,270.2 131.0,278.5"/></g>
          </g>
          <g id="legR" class="limb p-legR">
            <use href="#legRShape" class="glit"/>
            <g clip-path="url(#legRClip)"><polygon class="ink" points="156,261 129,267 129,281 156,275"/><polyline class="lace" points="152.0,266.5 146.8,274.8 141.5,269.0 136.2,277.2 131.0,271.5"/><polyline class="lace" points="152.0,273.5 146.8,267.8 141.5,276.0 136.2,270.2 131.0,278.5"/></g>
          </g>
                    <!-- 手臂（画在躯干下面，从肩膀底下伸出来）：上臂细直，手肘外侧尖角，小臂稍粗收到手腕，手指细长张开、指尖尖。左臂黑、上臂一块竖着的绿；右臂红 -->
          <g id="arms">
            <g id="armL" class="limb p-armL">
              <use href="#armLShape" class="ink"/>
              <polygon class="green" points="107,171 114,177 109,206 101,204 100,212"/>
            </g>
            <g id="armR" class="limb p-armR">
              <use href="#armRShape" class="glit"/>
            </g>
          </g>
          <rect class="ink" x="128.5" y="158" width="5" height="16"/>
          <use href="#torsoShape" class="ink"/>
          <g clip-path="url(#torsoClip)">
            <!-- 领口以上（F、斜绿、左肩绿、右肩红）照 body/14.50.33；胸部以下照 body/1.png、2.png（正面）：
                 胸前红块下缘两边各一个往下的倒钩，中间收成尖；腰上黑色 X 把腰分成四个三角，左边绿、其余红；
                 胯部整块粉红；大腿根各自一圈黑带，上面细红线像鞋带一样 -->
            <polygon class="glit" points="141,172 153,171 156,176 150,186.5 143.5,184"/>
            <!-- 胸：一大块圆鼓的红，和身体两侧之间留出宽黑边；下胸围两边各一块粗黑块斜着插进来，
                 黑块下面各露出一个往下的红倒钩，中间的红收窄往下接到腰上的 X -->
            <polygon class="glit" points="121,186.5 141,186.5 146,190 147,204 141,211 136,215 131,223 126,215 121,211 115,204 116,190"/>
            <polygon class="ink" points="106,203.5 123.5,208.5 121,216 106,211"/>
            <polygon class="ink" points="156,203.5 138.5,208.5 141,216 156,211"/>
            <polygon class="glit" points="115.9,212.5 123.0,216.3 119.2,223"/>
            <polygon class="glit" points="146.1,212.5 139.0,216.3 142.8,223"/>
            <!-- 腰上的 X：四个三角 -->
            <polygon class="glit" points="123,224.5 139,224.5 131,233.4"/>
            <polygon class="green" points="117,225.8 129,235.1 117,244.4"/>
            <polygon class="glit" points="145,225.8 133,235.1 145,244.4"/>
            <!-- 胯部整块粉红：从 X 下面一直到躯干下沿 -->
            <polygon class="glit" points="131,236.8 112,257 113,267 131,272.5 149,267 150,257"/>
            <polygon class="glit" points="127.6,172 136.7,172 136.7,175.1 129.9,175.1 129.9,178.2 135.3,178.2 135.3,181 129.9,181 129.9,187.6 127.6,187.6"/>
            <polygon class="green" points="118.1,177.8 125.3,179.8 123,184.9 117.3,183.7"/>
            <polygon class="green" points="103,168 111,170.5 116.1,189.6 108.7,202.1"/>
          </g>
        </g>


        <!-- 脸（外层只负责定位，#head 自己的 transform 留给 CSS 状态动画） -->
        <g transform="translate(0,16)">
        <g id="head">
          <use href="#headShape" class="ol" transform="translate(-1.5,1.5)"/>
          <use href="#headShape" class="ink"/>
          <g clip-path="url(#headClip)">
            <!-- 绿色面罩：横跨整张脸的宽带 -->
            <polygon id="face" class="green" points="100,115.5 162,115.5 162,133 100,133"/>
            <!-- 眼睛：以绿环外半径为 1 单位。黑眼眶平底、外上角拉尖、内上一根眉刺、外下一根细刺连到面罩下沿；
                 里面依次是绿环(1→.88)、黑圈、蓝虹膜(.61)、带黑边的白瞳孔(.29)。右眼照原图描，左眼镜像 -->
            <g id="eyes">
              <g class="eye" id="eyeL" transform="translate(121.1,126.4) scale(4.8)">
                <g class="eye-open">
                  <path class="ink" d="M-1.44,1.02 L-1.41,.5 L-1.33,0 L-1.17,-.6 L-.98,-.88 L-1.36,-1.77 L-.67,-1.25 Q-.25,-1.55 .41,-1.63 L1.15,-1.63 Q1.65,-1.57 2.05,-1.42 L1.68,-.06 L1.26,.57 L1.11,.77 L1.3,1.35 L.95,1.03 Q.45,1.1 .04,1.1 Z" transform="scale(-1,1)"/>
                  <circle r="1" class="green"/>
                  <circle r=".88" class="ink"/>
                  <g class="pupil"><circle r=".61" class="iris"/><circle r=".33" class="ink"/><circle r=".29" class="glint"/></g>
                </g>
                <path class="eye-closed" d="M-1.3,.25 Q0,-.75 1.3,.25 M-.75,-.25 L-1.15,-.95" transform="scale(-1,1)"/>
              </g>
              <g class="eye" id="eyeR" transform="translate(140.9,126.4) scale(4.8)">
                <g class="eye-open">
                  <path class="ink" d="M-1.44,1.02 L-1.41,.5 L-1.33,0 L-1.17,-.6 L-.98,-.88 L-1.36,-1.77 L-.67,-1.25 Q-.25,-1.55 .41,-1.63 L1.15,-1.63 Q1.65,-1.57 2.05,-1.42 L1.68,-.06 L1.26,.57 L1.11,.77 L1.3,1.35 L.95,1.03 Q.45,1.1 .04,1.1 Z"/>
                  <circle r="1" class="green"/>
                  <circle r=".88" class="ink"/>
                  <g class="pupil"><circle r=".61" class="iris"/><circle r=".33" class="ink"/><circle r=".29" class="glint"/></g>
                </g>
                <path class="eye-closed" d="M-1.3,.25 Q0,-.75 1.3,.25 M-.75,-.25 L-1.15,-.95"/>
              </g>
            </g>
            <g id="mouths">
              <polyline class="mouth m-neutral" points="127.6,139.4 131.8,138.6 132.9,140.2 136.6,139.6"/>
              <polygon class="mouth m-happy teeth" points="128,136.6 130.8,137 131.9,138.3 133,136.9 135.8,136.6 132.3,142.2"/>
              <polygon class="mouth m-shock teeth" points="127.6,142.6 130.6,136 132.2,138.8 133.4,137.4 136.4,142"/>
              <polyline class="mouth m-sleep" points="128.5,138.6 129.8,137.9 131.1,138.9 132.4,137.9 133.7,138.9 135,138.1"/>
            </g>
          </g>
          <!-- 刘海：盖住头顶，一根红色长发尖从两眼之间斜着扎下来，底边一道细黑边 -->
          <g id="bangs">
            <g clip-path="url(#headClip)"><use href="#bangsShape" class="ink" transform="translate(0,1.2)"/></g>
            <use href="#bangsShape" class="hair-fill"/>
            <!-- 和头发同样的白光、细闪粉，不然刘海看着是一块平的红 -->
            <rect x="100" y="88" width="62" height="48" fill="url(#hazeGrad)" clip-path="url(#bangsClip)"/>
            <rect class="glitter" x="100" y="88" width="62" height="48" fill="url(#fineGlit)" opacity=".5" clip-path="url(#bangsClip)"/>
            <g class="glitter" clip-path="url(#bangsClip)" id="splatBangs"></g>
          </g>
        </g>
        </g>

        <g id="zzz"><text x="150" y="122">z</text><text x="162" y="106">z</text><text x="176" y="88">Z</text></g>
        <g id="hearts"><text x="80" y="102">!</text><text x="182" y="94">✦</text></g>
    </svg>
  </div>
</div>
<script src="pet.js"></script>
</body>
</html>
