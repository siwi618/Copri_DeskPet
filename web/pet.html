<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Copri</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>
<div id="stage">
  <div id="bubble" class="hidden"><span id="bubble-text"></span></div>

  <svg id="copri" viewBox="0 0 260 470" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- redGlit：红底泼墨闪粉，用在身上的红色部分（墨点由 pet.js 生成） -->
      <pattern id="redGlit" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#e43050"/></pattern>

      <!-- 轮廓形状：不带 class，方便 <use> 上色（紫色描边层和本体共用） -->
      <polygon id="hairShape" points="22,252 34,200 6,206 22,160 0,150 20,118 6,96 30,96 18,48 58,52 62,10 100,22 104,0 150,6 156,22 198,4 196,34 240,30 224,62 258,74 238,98 256,128 236,128 250,178 226,160 238,232 212,192 206,256 190,204 178,238 168,192 162,160 160,124 104,124 102,160 92,196 82,240 72,200 60,246 54,204 40,240"/>
      <polygon id="torsoShape" points="112,166 150,166 155,178 153,192 146,206 140,222 146,236 154,250 150,262 131,268 112,262 108,250 116,236 122,222 116,206 109,192 107,178"/>
      <polygon id="legLShape" points="109,250 128,264 126,300 122,340 123,410 120,440 117,464 114,440 113,410 110,340 106,292"/>
      <polygon id="legRShape" points="153,250 156,292 152,340 150,408 154,436 156,462 146,440 140,410 140,342 136,300 134,264"/>
      <polygon id="armLShape" points="110,168 97,226 90,280 84,300 89,291 88,309 92,293 94,307 95,291 99,301 96,282 104,228 118,175"/>
      <polygon id="armRShape" points="152,168 165,226 172,280 178,300 173,291 174,309 170,293 168,307 167,291 163,301 166,282 158,228 144,175"/>
      <polygon id="headShape" points="100,104 162,100 164,126 154,142 136,170 128,170 112,148 99,128"/>

      <clipPath id="hairClip"><use href="#hairShape"/></clipPath>
    </defs>

    <g id="shadow"><ellipse cx="135" cy="466" rx="30" ry="4"/></g>

    <g id="pet">
      <!-- 漂浮的绿色碎片 -->
      <g id="shards">
        <polygon class="shard s1" points="30,280 36,274 24,350 18,356"/>
        <polygon class="shard s2" points="44,330 48,326 42,376 37,380"/>
        <polygon class="shard s3" points="226,240 231,236 226,300 221,304"/>
      </g>

      <!-- 头发（后层） -->
      <g id="hair">
        <g id="strands">
          <polygon class="ol" points="40,196 50,200 22,300 16,296" transform="translate(-3,3)"/>
          <polygon class="red" points="40,196 50,200 22,300 16,296"/>
          <polygon class="ol" points="70,220 78,222 58,332 52,328" transform="translate(-3,3)"/>
          <polygon class="red" points="70,220 78,222 58,332 52,328"/>
          <polygon class="ol" points="206,196 216,192 240,306 234,310" transform="translate(-3,3)"/>
          <polygon class="red" points="206,196 216,192 240,306 234,310"/>
          <polygon class="ol" points="184,226 192,224 200,322 194,324" transform="translate(-3,3)"/>
          <polygon class="red" points="184,226 192,224 200,322 194,324"/>
          <polygon class="ol" points="214,92 260,74 260,84 232,100" transform="translate(-3,3)"/>
          <polygon class="red" points="214,92 260,74 260,84 232,100"/>
          <polygon class="ol" points="40,104 0,96 0,88 30,94" transform="translate(-3,3)"/>
          <polygon class="red" points="40,104 0,96 0,88 30,94"/>
        </g>
        <use href="#hairShape" class="hair-ol" transform="translate(-4,4)"/>
        <use href="#hairShape" class="hair-fill"/>
        <g class="glitter gA" clip-path="url(#hairClip)" id="splatA"></g>
        <g class="glitter gB" clip-path="url(#hairClip)" id="splatB"></g>
        <!-- 发丝间的黑色斜切 -->
        <polygon class="ink" points="30,140 92,118 34,150"/>
        <polygon class="ink" points="238,120 174,114 232,130"/>
        <polygon class="ink" points="200,40 178,96 206,52"/>
        <polygon class="ink" points="64,60 70,104 56,70"/>
        <!-- 头发下层：黑色，尖刺朝下、朝外 -->
        <polygon class="ink" points="92,112 172,108 196,128 172,132 186,176 164,150 166,214 152,160 140,170 120,170 108,160 100,212 96,156 74,180 88,134 62,130"/>
        <!-- 脸两侧垂下来的红色发束 -->
        <polygon class="ol" points="96,108 114,110 98,204 92,150" transform="translate(-3,3)"/>
        <polygon class="red" points="96,108 114,110 98,204 92,150"/>
        <polygon class="ol" points="150,106 170,104 176,150 172,200" transform="translate(-3,3)"/>
        <polygon class="red" points="150,106 170,104 176,150 172,200"/>
      </g>

      <!-- 身体 -->
      <g id="body">
        <g id="legL" class="limb">
          <use href="#legLShape" class="ol" transform="translate(-2.5,2.5)"/>
          <use href="#legLShape" class="ink"/>
          <polygon class="green" points="110,268 122,272 118,296 110,290"/>
          <polygon class="red" points="114,350 118,350 120,412 117,412"/>
        </g>
        <g id="legR" class="limb">
          <use href="#legRShape" class="ol" transform="translate(-2.5,2.5)"/>
          <use href="#legRShape" class="glit"/>
          <polygon class="ink" points="146,330 150,340 146,352 142,340"/>
          <polygon class="ink" points="136,268 146,262 140,290"/>
        </g>
        <rect class="ink" x="126" y="150" width="9" height="20"/>
        <use href="#torsoShape" class="ol" transform="translate(-2.5,2.5)"/>
        <use href="#torsoShape" class="ink"/>
        <polygon class="green" points="112,166 128,166 120,186 109,192 107,178"/>
        <polygon class="glit" points="130,170 150,166 155,178 153,192 144,200 134,194 130,182"/>
        <polygon class="ink" points="140,176 146,182 142,190 137,183"/>
        <polygon class="glit" points="129,200 136,204 134,222 129,222"/>
        <polygon class="glit" points="140,222 146,236 154,250 150,262 140,264 146,244"/>
        <polygon class="green" points="108,250 120,256 112,268"/>
        <polygon class="red" points="112,244 152,252 152,255 112,247"/>
      </g>

      <!-- 手臂 -->
      <g id="arms">
        <g id="armL" class="limb">
          <use href="#armLShape" class="ol" transform="translate(-2.5,2.5)"/>
          <use href="#armLShape" class="ink"/>
          <polygon class="green" points="111,172 117,176 112,196 107,190"/>
        </g>
        <g id="armR" class="limb">
          <use href="#armRShape" class="ol" transform="translate(-2.5,2.5)"/>
          <use href="#armRShape" class="ink"/>
          <polygon class="glit" points="160,232 165,228 171,278 166,282"/>
        </g>
      </g>

      <!-- 脸 -->
      <g id="head">
        <use href="#headShape" class="ol" transform="translate(-2.5,2.5)"/>
        <use href="#headShape" class="ink"/>
        <polygon id="face" class="green" points="100,106 162,102 164,124 158,135 108,144 98,130"/>
        <g id="eyes">
          <g class="eye" id="eyeL" transform="translate(115,122) scale(1.42)">
            <g class="eye-open">
              <polygon class="ink" points="-13,6 -9,-6 -3,-9.5 4,-9.5 9,-6 13,-11 11,1 7,7 0,9.5 -6,8.5"/>
              <circle r="7.6" class="eye-ring"/>
              <g class="pupil"><circle r="5.6" class="iris"/><ellipse rx="2.5" ry="2.9" class="glint"/></g>
            </g>
            <path class="eye-closed" d="M-8,-1 Q0,5 8,-1 M-8,-1 L-12,-5 M8,-1 L12,-5"/>
          </g>
          <g class="eye" id="eyeR" transform="translate(148,119) scale(1.42)">
            <g class="eye-open">
              <polygon class="ink" points="13,6 9,-6 3,-9.5 -4,-9.5 -9,-6 -13,-11 -11,1 -7,7 0,9.5 6,8.5"/>
              <circle r="7.6" class="eye-ring"/>
              <g class="pupil"><circle r="5.6" class="iris"/><ellipse rx="2.5" ry="2.9" class="glint"/></g>
            </g>
            <path class="eye-closed" d="M-8,-1 Q0,5 8,-1 M-8,-1 L-12,-5 M8,-1 L12,-5"/>
          </g>
        </g>
        <g id="mouths">
          <polyline class="mouth m-neutral" points="121,151 130,151 133,148 135,152 142,151"/>
          <polygon class="mouth m-happy teeth" points="117,145 147,142 141,149 136,146 132,155 127,147 121,151"/>
          <polygon class="mouth m-shock teeth" points="124,144 140,143 131,156"/>
          <polyline class="mouth m-sleep" points="122,151 128,152 134,151 140,152"/>
        </g>
      </g>

      <!-- 刘海（前层） -->
      <g id="bangs">
        <polygon class="ink" points="96,99 114,99 101,124"/>
        <polygon class="ink" points="150,97 168,96 164,118"/>
        <polygon class="hair-fill" points="92,96 108,97 99,110"/>
        <polygon class="hair-fill" points="156,94 170,94 166,106"/>
        <polygon class="hair-fill" points="122,97 142,96 135,110 139,108 130,132 132,115 126,117"/>
      </g>

      <g id="zzz"><text x="160" y="104">z</text><text x="174" y="86">z</text><text x="190" y="66">Z</text></g>
      <g id="hearts"><text x="80" y="92">!</text><text x="182" y="84">✦</text></g>
    </g>
  </svg>
</div>
<script src="pet.js"></script>
</body>
</html>
