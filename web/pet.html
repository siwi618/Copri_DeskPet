<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Copri</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>
<div id="stage">
  <div id="bubble" class="hidden"><span id="bubble-text"></span></div>

  <svg id="copri" viewBox="0 0 260 470" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- redGlit：红底泼墨闪粉，用在身上的红色部分（墨点由 pet.js 生成） -->
      <pattern id="redGlit" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#e43050"/></pattern>

      <!-- 轮廓形状：不带 class，方便 <use> 上色（紫色描边层和本体共用） -->
      <path id="hairShape" d="M124,150 L108,158 L101,186 L96,166 L82,168 L80,162 L68,176 L64,160 L40,164 L12,174 L28,150 L22,148 L24,142 L18,126 L-2,102 L22,108 L20,86 L26,84 L22,56 L34,52 L30,-6 L56,44 L70,38 L72,32 L78,34 L92,28 L106,24 L120,-30 L118,-6 L124,-4 L128,22 L150,18 L164,-2 L170,22 L188,22 L210,-22 L204,22 L212,26 L226,30 L230,48 L236,50 L238,62 L264,68 L240,80 L246,96 L244,112 L250,114 L248,132 L258,152 L236,148 L234,182 L224,160 L212,166 L210,158 L190,162 L178,152 L162,156 L156,146 L144,144 Z"/>
      <polygon id="torsoShape" points="106,166 156,166 157,176 153,192 146,206 140,222 146,236 154,250 150,262 131,268 112,262 108,250 116,236 122,222 116,206 109,192 105,176"/>
      <polygon id="legLShape" points="109,250 128,264 126,300 122,340 123,410 120,440 117,464 114,440 113,410 110,340 106,292"/>
      <polygon id="legRShape" points="153,250 156,292 152,340 150,408 154,436 156,462 146,440 140,410 140,342 136,300 134,264"/>
      <polygon id="armLShape" points="106,168 93,226 86,280 80,300 85,291 84,309 88,293 90,307 91,291 95,301 92,282 100,228 114,175"/>
      <polygon id="armRShape" points="156,168 169,226 176,280 182,300 177,291 178,309 174,293 172,307 171,291 167,301 170,282 162,228 148,175"/>
      <!-- 头：按 face 文件夹正脸特写（12.51.18 等）测量。面罩两侧就是脸的两侧，往下收窄，下巴是偏左的 V 形 -->
      <path id="headShape" d="M107,104 L155,104 L152.9,115.5 L147.5,133 L146,138.6 L128,146.8 L115,139.6 L114.5,133 L109.1,115.5 Z"/>
      <polygon id="bangsShape" points="104,94 158,94 157,111.6 152.6,114.4 148,111.4 143,114.6 137.4,111.8 131.6,112.6 123.9,129.9 128.4,112.9 121,114.6 116.2,111.6 111.4,114.4 106,111.8"/>
      <clipPath id="bangsClip"><use href="#bangsShape"/></clipPath>

      <clipPath id="hairClip"><use href="#hairShape"/></clipPath>
      <clipPath id="headClip"><use href="#headShape"/></clipPath>
    </defs>

    <g id="shadow"><ellipse cx="135" cy="466" rx="30" ry="4"/></g>

    <g id="pet">
      <!-- 漂浮的绿色碎片 -->
      <g id="shards">
        <polygon class="shard s1" points="30,280 36,274 24,350 18,356"/>
        <polygon class="shard s2" points="44,330 48,326 42,376 37,380"/>
        <polygon class="shard s3" points="226,240 231,236 226,300 221,304"/>
      </g>

      <!-- 头发（后层）：像火焰/云一样向上飘 -->
      <g id="hair">
        <use href="#hairShape" class="hair-ol" transform="translate(-3.2,3.6)"/>
        <!-- 底部细黑边：黑色同形状往下错开一点，只在朝下的边缘露出来 -->
        <use href="#hairShape" class="ink" transform="translate(0,2.2)"/>
        <use href="#hairShape" class="hair-fill"/>
        <g class="glitter gA" clip-path="url(#hairClip)" id="splatA"></g>
        <g class="glitter gB" clip-path="url(#hairClip)" id="splatB"></g>
      </g>

      <!-- 身体 -->
      <g id="body">
        <g id="legL" class="limb">
          <use href="#legLShape" class="ol" transform="translate(-2.5,2.5)"/>
          <use href="#legLShape" class="ink"/>
          <polygon class="green" points="110,268 122,272 118,296 110,290"/>
          <polygon class="red" points="114,350 118,350 120,412 117,412"/>
        </g>
        <g id="legR" class="limb">
          <use href="#legRShape" class="ol" transform="translate(-2.5,2.5)"/>
          <use href="#legRShape" class="glit"/>
          <polygon class="ink" points="146,330 150,340 146,352 142,340"/>
          <polygon class="ink" points="136,268 146,262 140,290"/>
        </g>
        <rect class="ink" x="125.6" y="146" width="5" height="22"/>
        <use href="#torsoShape" class="ol" transform="translate(-2.5,2.5)"/>
        <use href="#torsoShape" class="ink"/>
        <polygon class="green" points="106,166 128,166 120,186 109,192 105,176"/>
        <polygon class="glit" points="130,170 156,166 157,176 153,192 144,200 134,194 130,182"/>
        <polygon class="ink" points="140,176 146,182 142,190 137,183"/>
        <polygon class="glit" points="129,200 136,204 134,222 129,222"/>
        <polygon class="glit" points="140,222 146,236 154,250 150,262 140,264 146,244"/>
        <polygon class="green" points="108,250 120,256 112,268"/>
        <polygon class="red" points="112,244 152,252 152,255 112,247"/>
      </g>

      <!-- 手臂 -->
      <g id="arms">
        <g id="armL" class="limb">
          <use href="#armLShape" class="ol" transform="translate(-2.5,2.5)"/>
          <use href="#armLShape" class="ink"/>
          <polygon class="green" points="107,172 113,176 108,196 103,190"/>
        </g>
        <g id="armR" class="limb">
          <use href="#armRShape" class="ol" transform="translate(-2.5,2.5)"/>
          <use href="#armRShape" class="ink"/>
          <polygon class="glit" points="164,232 169,228 175,278 170,282"/>
        </g>
      </g>

      <!-- 脸（外层只负责定位，#head 自己的 transform 留给 CSS 状态动画） -->
      <g transform="translate(0,6)">
      <g id="head">
        <use href="#headShape" class="ol" transform="translate(-1.5,1.5)"/>
        <use href="#headShape" class="ink"/>
        <g clip-path="url(#headClip)">
          <!-- 绿色面罩：横跨整张脸的宽带 -->
          <polygon id="face" class="green" points="100,115.5 162,115.5 162,133 100,133"/>
          <!-- 眼睛：以绿环外半径为 1 单位。黑眼眶平底、外上角拉尖、内上一根眉刺、外下一根细刺连到面罩下沿；
               里面依次是绿环(1→.88)、黑圈、蓝虹膜(.61)、带黑边的白瞳孔(.29)。右眼照原图描，左眼镜像 -->
          <g id="eyes">
            <g class="eye" id="eyeL" transform="translate(121.1,126.4) scale(4.8)">
              <g class="eye-open">
                <path class="ink" d="M-1.44,1.02 L-1.41,.5 L-1.33,0 L-1.17,-.6 L-.98,-.88 L-1.36,-1.77 L-.67,-1.25 Q-.25,-1.55 .41,-1.63 L1.15,-1.63 Q1.65,-1.57 2.05,-1.42 L1.68,-.06 L1.26,.57 L1.11,.77 L1.3,1.35 L.95,1.03 Q.45,1.1 .04,1.1 Z" transform="scale(-1,1)"/>
                <circle r="1" class="green"/>
                <circle r=".88" class="ink"/>
                <g class="pupil"><circle r=".61" class="iris"/><circle r=".33" class="ink"/><circle r=".29" class="glint"/></g>
              </g>
              <path class="eye-closed" d="M-1.3,.25 Q0,-.75 1.3,.25 M-.75,-.25 L-1.15,-.95" transform="scale(-1,1)"/>
            </g>
            <g class="eye" id="eyeR" transform="translate(140.9,126.4) scale(4.8)">
              <g class="eye-open">
                <path class="ink" d="M-1.44,1.02 L-1.41,.5 L-1.33,0 L-1.17,-.6 L-.98,-.88 L-1.36,-1.77 L-.67,-1.25 Q-.25,-1.55 .41,-1.63 L1.15,-1.63 Q1.65,-1.57 2.05,-1.42 L1.68,-.06 L1.26,.57 L1.11,.77 L1.3,1.35 L.95,1.03 Q.45,1.1 .04,1.1 Z"/>
                <circle r="1" class="green"/>
                <circle r=".88" class="ink"/>
                <g class="pupil"><circle r=".61" class="iris"/><circle r=".33" class="ink"/><circle r=".29" class="glint"/></g>
              </g>
              <path class="eye-closed" d="M-1.3,.25 Q0,-.75 1.3,.25 M-.75,-.25 L-1.15,-.95"/>
            </g>
          </g>
          <g id="mouths">
            <polyline class="mouth m-neutral" points="127.6,139.4 131.8,138.6 132.9,140.2 136.6,139.6"/>
            <polygon class="mouth m-happy teeth" points="128,136.6 130.8,137 131.9,138.3 133,136.9 135.8,136.6 132.3,142.2"/>
            <polygon class="mouth m-shock teeth" points="127.6,142.6 130.6,136 132.2,138.8 133.4,137.4 136.4,142"/>
            <polyline class="mouth m-sleep" points="128.5,138.6 129.8,137.9 131.1,138.9 132.4,137.9 133.7,138.9 135,138.1"/>
          </g>
        </g>
        <!-- 刘海：盖住头顶，一根红色长发尖从两眼之间斜着扎下来，底边一道细黑边 -->
        <g id="bangs">
          <g clip-path="url(#headClip)"><use href="#bangsShape" class="ink" transform="translate(0,1.2)"/></g>
          <use href="#bangsShape" class="hair-fill"/>
          <use href="#splatA" class="glitter gA" clip-path="url(#bangsClip)"/>
        </g>
      </g>
      </g>

      <g id="zzz"><text x="150" y="112">z</text><text x="162" y="96">z</text><text x="176" y="78">Z</text></g>
      <g id="hearts"><text x="80" y="92">!</text><text x="182" y="84">✦</text></g>
    </g>
  </svg>
</div>
<script src="pet.js"></script>
</body>
</html>
