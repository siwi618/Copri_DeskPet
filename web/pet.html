          <polygon id="armRShape" points="155.4,165.8 146.8,171.4 145.7,184.5 153.5,210.1 159.1,239.7 160.4,244.7 162.1,261.6 165.9,294.4 166.8,299.3 164.6,306.5 161,315.9 163.3,316.7 166.8,307.4 166.5,317 166.7,317.3 166.9,328.3 169,328.3 168.8,317.3 169.3,317.5 170.2,331 172.3,330.8 171.4,317.4 171.9,317.3 173.1,329.4 175.2,329.2 174,317.1 174.4,316.7 175.7,325.6 177.8,325.3 176.4,316.4 176,310.7 174.6,304.8 173.2,301.4 171.7,298 169.9,267 170.3,244 167.9,235.1 163.6,204.3 160.8,185.5 157.9,172.7"/>

        <!-- 头发（后层）：轮廓从原图 general/08.29.28 自动描出（红色部分，含发束间的缝隙），按脸的位置对齐缩放 -->
        <g id="hair" transform="translate(0,10)">
          <use href="#hairShape" class="hair-ol" transform="translate(-3.2,3.6)"/>

          <use href="#hairShape" class="ink" transform="translate(0,2.2)"/>
          <!-- 头发暗面：头后面压在红发下面的黑色闪电发束，只从红发底下露出来（照 08.29.28 底部，坐标按原图换算）：
               左下一大束台阶状黑发、右下一小束、脸后几根朝上的黑尖，同样带紫色错位描边 -->
          <use href="#crownShape" class="hair-ol" transform="translate(-2.4,2.6)"/>
          <use href="#crownShape" class="ink"/>

      <!-- 会闪的那层闪粉单独一层，只改透明度 -->

    <svg id="copri" class="layer" viewBox="0 0 260 560" xmlns="http://www.w3.org/2000/svg">

        <!-- 身体：轮廓比例照 07.47.01 全身、08.25.42 正面；躯干图案照 body/ 文件夹的正面特写 -->
        <g id="body">
          <!-- 紫色描边全部放最底下（躯干 + 四肢），填色都画在上面：只在整个人的外轮廓露出紫边，
               四肢和躯干之间不再出现紫线，看起来是一整个身体。四肢描边用 p-* class 跟着四肢一起动 -->
          <g class="limb p-legL"><use href="#legLShape" class="ol" transform="translate(-2.5,2.5)"/></g>
          <g class="limb p-legR"><use href="#legRShape" class="ol" transform="translate(-2.5,2.5)"/></g>
          <g class="limb p-armL"><use href="#armLShape" class="ol" transform="translate(-2.5,2.5)"/></g>
          <g class="limb p-armR"><use href="#armRShape" class="ol" transform="translate(-2.5,2.5)"/></g>
          <use href="#torsoShape" class="ol" transform="translate(-2.5,2.5)"/>
          <g id="legL" class="limb p-legL">
            <use href="#legLShape" class="ink"/>
            <g clip-path="url(#legLClip)"><polygon class="green" points="100,285 135,291.5 135,304 100,297.5"/></g>
            <!-- 大腿根：紧贴胯下的一圈黑带，上面鞋带状红线；两条腿各自一圈，不连在一起 -->
            <g clip-path="url(#legLClip)"><polygon class="ink" points="106,261 133,267 133,281 106,275"/><polyline class="lace" points="110.0,266.5 115.2,274.8 120.5,269.0 125.8,277.2 131.0,271.5"/><polyline class="lace" points="110.0,273.5 115.2,267.8 120.5,276.0 125.8,270.2 131.0,278.5"/></g>
          </g>
          <g id="legR" class="limb p-legR">
            <use href="#legRShape" class="glit"/>
            <g clip-path="url(#legRClip)"><polygon class="ink" points="164,281 124,297.5 164,321.5 164,314 133,297.5 164,288.5"/></g>
            <g clip-path="url(#legRClip)"><polygon class="ink" points="156,261 129,267 129,281 156,275"/><polyline class="lace" points="152.0,266.5 146.8,274.8 141.5,269.0 136.2,277.2 131.0,271.5"/><polyline class="lace" points="152.0,273.5 146.8,267.8 141.5,276.0 136.2,270.2 131.0,278.5"/></g>
          </g>
                    <!-- 手臂（画在躯干下面，从肩膀底下伸出来）：上臂细直，手肘外侧尖角，小臂稍粗收到手腕，手臂从肩膀往外张约 4°、手垂在大腿外侧；手掌从手腕往下放宽，拇指单独斜出，手指像薯条：等宽的直条、指尖平切，四根并拢留细缝，长短不一。左臂黑、肩头一圈绿环；右臂红、上臂一圈黑环 -->
          <g id="arms">
            <g id="armL" class="limb p-armL">
              <use href="#armLShape" class="ink"/>
            </g>
            <g id="armR" class="limb p-armR">
              <use href="#armRShape" class="glit"/>
              <g clip-path="url(#armRClip)"><polygon class="ink" points="140,201 172,196 172,207 140,212"/></g>
            </g>
          </g>
          <rect class="ink" x="128.5" y="158" width="5" height="16"/>
          <use href="#torsoShape" class="ink"/>
          <g clip-path="url(#torsoClip)">
            <!-- 领口以上（F、斜绿、左肩绿、右肩红）照 body/14.50.33；胸部以下照 body/1.png、2.png（正面）：
                 胸前红块下缘两边各一个往下的倒钩，中间收成尖；腰上黑色 X 把腰分成四个三角，左边绿、其余红；

            <polygon class="glit" points="141,172 153,171 156,176 150,186.5 143.5,184"/>

                 黑块下面各露出一个往下的红倒钩，中间的红收窄往下接到腰上的 X -->
            <polygon class="glit" points="121,186.5 141,186.5 146,190 147,204 141,211 136,215 131,223 126,215 121,211 115,204 116,190"/>

            <polygon class="glit" points="146.1,212.5 139.0,216.3 142.8,223"/>
            <!-- 腰上的 X：四个三角 -->
            <polygon class="glit" points="123,224.5 139,224.5 131,233.4"/>
            <polygon class="green" points="117,225.8 129,235.1 117,244.4"/>
            <polygon class="glit" points="145,225.8 133,235.1 145,244.4"/>
            <!-- 胯部整块粉红：从 X 下面一直到躯干下沿 -->
            <polygon class="glit" points="131,236.8 109,257 109,268 131,273 153,268 153,257"/>
            <polygon class="glit" points="127.6,172 136.7,172 136.7,175.1 129.9,175.1 129.9,178.2 135.3,178.2 135.3,181 129.9,181 129.9,187.6 127.6,187.6"/>
            <polygon class="green" points="118.1,177.8 125.3,179.8 123,184.9 117.3,183.7"/>

          <g class="limb p-armL"><g clip-path="url(#armLClip)"><polygon class="green" points="90,160 125,160 125,190 90,198"/></g></g>

        <!-- 脸（外层只负责定位，#head 自己的 transform 留给 CSS 状态动画） -->

        <g id="head">
          <use href="#headShape" class="ol" transform="translate(-1.5,1.5)"/>

          <g clip-path="url(#headClip)">
